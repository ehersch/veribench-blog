<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting to VeriBench Blog</title>
    <meta
      name="description"
      content="Redirects the VeriBench GitHub Pages root to the latest blog entry."
    />
    <meta http-equiv="refresh" content="0; url=./blog/veribench-launch/" />
    <link rel="canonical" href="./blog/veribench-launch/" />
    <script>
      window.location.replace("./blog/veribench-launch/");
    </script>
  </head>
  <body>
    <p>
      Redirecting to the blog post.
      <a href="./blog/veribench-launch/">Continue if the redirect does not happen automatically.</a>
    </p>
  </body>
</html>
